:root{color-scheme:light;--bg:#f6f8fb;--line:#dde3ec;--text:#0f172a;--muted:#475569;--accent:#073964;--soft:#e8eef7}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:'IBM Plex Sans KR','Malgun Gothic','Apple SD Gothic Neo',system-ui,sans-serif;font-size:17px;line-height:1.7;word-break:keep-all;overflow-wrap:anywhere}
.wrap{max-width:680px;margin:0 auto;padding-inline:16px;padding-block:14px calc(40px + env(safe-area-inset-bottom,0px))}
.top{display:flex;justify-content:space-between;align-items:center;gap:12px;color:var(--muted);font-size:14px;font-weight:700}.top img{height:36px;width:auto}
.head{padding-block:16px 4px}.head small{color:var(--accent);font-weight:700;font-size:13px}.head h1{margin:4px 0 6px;font-size:26px;line-height:1.35;text-wrap:balance}.head p{margin:0;color:var(--muted);font-size:16px}
.btns{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
.btn{font:inherit;font-size:15px;font-weight:700;display:inline-flex;align-items:center;gap:8px;min-height:48px;padding:10px 18px;border-radius:12px;border:1px solid var(--accent);background:var(--accent);color:#fff;cursor:pointer;text-decoration:none}.btn.ghost{background:#fff;color:var(--accent)}
.scenes{list-style:none;margin:18px 0 0;padding:0;display:grid;gap:14px}
.scene{background:#fff;border:1px solid var(--line);border-radius:18px;overflow:hidden;box-shadow:0 1px 2px rgba(15,23,42,.05)}.scene.now{box-shadow:0 0 0 2px var(--accent)}
.scene img{display:block;width:100%;height:auto;aspect-ratio:5/3;object-fit:cover;background:#07111a}
.body{padding:14px 16px 16px;display:grid;gap:6px}.row{display:flex;justify-content:space-between;align-items:center;gap:10px}
.scene h2{margin:0;font-size:19px;display:flex;gap:8px;align-items:baseline}.scene h2 span{font-size:13px;color:var(--accent);font-variant-numeric:tabular-nums}
.scene p{margin:0;font-size:17px}

.note{margin-top:20px;font-size:13px;color:var(--muted)}.note a{color:var(--accent)}
