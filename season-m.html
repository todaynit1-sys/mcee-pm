<section class="head"><small>제8차 (’26.12~’27.3)</small><h1>미세먼지 계절관리제</h1><p>초미세먼지 고농도 시기인 12월부터 이듬해 3월까지 시행하는 제도를 소개합니다</p>

D.names.forEach((name, i) => { const li = document.createElement('li'); li.className = 'scene'; li.dataset.i = i;
  li.innerHTML = (D.thumbs[i] ? `<img src="${D.thumbs[i]}" alt="" loading="${i ? 'lazy' : 'eager'}" width="720" height="432">` : '') + `<div class="body"><div class="row"><h2><span>${String(i + 1).padStart(2, '0')}</span></h2>${D.voice[i] ? '<button class="say" type="button" aria-pressed="false">듣기</button>' : ''}</div><p></p></div>`;

  const b = li.querySelector('.say'); if (b) b.onclick = () => { if (on === i && !queue) stop(); else { queue = false; say(i) } };

if (!D.voice.some(Boolean)) all.hidden = true;
function paint() { document.querySelectorAll('.scene').forEach(el => { const i = +el.dataset.i; el.classList.toggle('now', i === on); const b = el.querySelector('.say'); if (b) { b.setAttribute('aria-pressed', String(i === on)); b.textContent = i === on ? '멈춤' : '듣기' } }); all.textContent = queue ? '해설 멈추기' : '처음부터 음성 해설 듣기' }
function stop() { audio.pause(); on = -1; queue = false; paint() }
function say(i) { audio.pause(); audio.src = D.voice[i]; audio.currentTime = 0; on = i; paint(); const p = audio.play(); if (p) p.catch(stop);

audio.onended = () => { if (queue && on + 1 < D.names.length) say(on + 1); else stop() };
