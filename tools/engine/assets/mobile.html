<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f5f8f3">
<title>{{TITLE_PLAIN}} · 읽기 모드 | 수도권대기환경청</title>
<style>
/* Phone-first reading view: one card per scene (picture, big caption, listen button) */
:root{color-scheme:light;--bg:#f5f8f3;--line:#d3e0d8;--text:#243e3c;--muted:#536e68;--accent:{{ACCENT_LIGHT}};--soft:#e7f1ec}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:'IBM Plex Sans KR','Malgun Gothic','Apple SD Gothic Neo',system-ui,sans-serif;font-size:17px;line-height:1.7;word-break:keep-all;overflow-wrap:anywhere}
.wrap{max-width:680px;margin:0 auto;padding-inline:16px;padding-block:14px calc(40px + env(safe-area-inset-bottom,0px))}
.top{display:flex;justify-content:space-between;align-items:center;gap:12px;color:var(--muted);font-size:14px;font-weight:700}.top img{height:32px;width:auto}
.head{padding-block:16px 4px}.head small{color:var(--accent);font-weight:700;font-size:13px}.head h1{margin:4px 0 6px;font-size:26px;line-height:1.35;text-wrap:balance}.head p{margin:0;color:var(--muted);font-size:16px}
.btns{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
.btn{font:inherit;font-size:15px;font-weight:700;display:inline-flex;align-items:center;gap:8px;min-height:48px;padding:10px 18px;border-radius:12px;border:1px solid var(--accent);background:var(--accent);color:#fff;cursor:pointer;text-decoration:none}.btn.ghost{background:#fff;color:var(--accent)}
.scenes{list-style:none;margin:18px 0 0;padding:0;display:grid;gap:14px}
.scene{background:#fff;border:1px solid var(--line);border-radius:18px;overflow:hidden;box-shadow:0 3px 0 #dce6dd}.scene.now{box-shadow:0 0 0 2px var(--accent)}
.scene img{display:block;width:100%;height:auto;aspect-ratio:5/3;object-fit:cover;background:#07111a}
.body{padding:14px 16px 16px;display:grid;gap:6px}.row{display:flex;justify-content:space-between;align-items:center;gap:10px}
.scene h2{margin:0;font-size:19px;display:flex;gap:8px;align-items:baseline}.scene h2 span{font-size:13px;color:var(--accent);font-variant-numeric:tabular-nums}
.scene p{margin:0;font-size:17px}
.say{font:inherit;font-size:14px;font-weight:700;min-height:40px;min-width:76px;border-radius:10px;border:1px solid var(--line);background:#fff;color:var(--accent);cursor:pointer}.say[aria-pressed=true]{background:var(--soft);border-color:var(--accent)}
.note{margin-top:20px;font-size:13px;color:var(--muted)}.note a{color:var(--accent)}
button:focus-visible,a:focus-visible{outline:3px solid #3267a2;outline-offset:3px}
</style></head><body><main class="wrap">
<div class="top"><img src="assets/logo.png" alt="기후에너지환경부 수도권대기환경청" width="102" height="32"><span>읽기 모드</span></div>
<section class="head"><small>{{DEPT}}</small><h1>{{TITLE_PLAIN}}</h1><p>{{DESC}}</p>
<div class="btns"><button class="btn" id="all" type="button">처음부터 음성 해설 듣기</button>{{VIDEO_LINK}}</div></section>
<ol class="scenes" id="scenes"></ol>
<p class="note">{{BASIS}} · 그림은 이해를 돕기 위한 개념도입니다{{SOURCE}}</p>
</main>
<script>
(() => {
const D = {{DATA_JSON}}, audio = new Audio(); let on = -1, queue = false;
const list = document.getElementById('scenes'), all = document.getElementById('all');
D.names.forEach((name, i) => { const li = document.createElement('li'); li.className = 'scene'; li.dataset.i = i;
  li.innerHTML = (D.thumbs[i] ? `<img src="${D.thumbs[i]}" alt="" loading="${i ? 'lazy' : 'eager'}" width="720" height="432">` : '') + `<div class="body"><div class="row"><h2><span>${String(i + 1).padStart(2, '0')}</span></h2>${D.voice[i] ? '<button class="say" type="button" aria-pressed="false">듣기</button>' : ''}</div><p></p></div>`;
  li.querySelector('h2').append(name); li.querySelector('p').textContent = D.captions[i];
  const b = li.querySelector('.say'); if (b) b.onclick = () => { if (on === i && !queue) stop(); else { queue = false; say(i) } };
  list.append(li) });
if (!D.voice.some(Boolean)) all.hidden = true;
function paint() { document.querySelectorAll('.scene').forEach(el => { const i = +el.dataset.i; el.classList.toggle('now', i === on); const b = el.querySelector('.say'); if (b) { b.setAttribute('aria-pressed', String(i === on)); b.textContent = i === on ? '멈춤' : '듣기' } }); all.textContent = queue ? '해설 멈추기' : '처음부터 음성 해설 듣기' }
function stop() { audio.pause(); on = -1; queue = false; paint() }
function say(i) { audio.pause(); audio.src = D.voice[i]; audio.currentTime = 0; on = i; paint(); const p = audio.play(); if (p) p.catch(stop);
  if (queue) list.children[i].scrollIntoView({behavior: matchMedia('(prefers-reduced-motion: reduce)').matches ? 'auto' : 'smooth', block: 'center'}) }
audio.onended = () => { if (queue && on + 1 < D.names.length) say(on + 1); else stop() };
all.onclick = () => { if (queue) { stop(); return } queue = true; say(0) };
})();
</script></body></html>
