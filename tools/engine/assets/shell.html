<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>{{TITLE_PLAIN}} · 모션그래픽</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;700&family=JetBrains+Mono:wght@500;600;700&display=swap">
<meta name="description" content="{{DESC}}">
<style>
:root{--page:#0b0d14;--card:#11141d;--raised:#181c27;--hair:rgba(238,241,244,.1);--text:#eef1f4;--sub:#a3acba;--mute:#7b8596;--accent:{{ACCENT}};color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--page);color:var(--text);font-family:'IBM Plex Sans KR','Malgun Gothic',sans-serif;margin:0;word-break:keep-all}
.wrap{max-width:1200px;margin:auto;padding:32px 24px 48px}
header{margin-bottom:20px}
header p{margin:0;color:var(--sub);font-size:14px}
h1{font-size:clamp(24px,3.4vw,32px);font-weight:500;margin:4px 0 0;line-height:1.3}
.stage{border:1px solid var(--hair);border-radius:14px;overflow:hidden;margin:0;background:#0a0f1a}
canvas{width:100%;aspect-ratio:5/3;display:block}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%);white-space:nowrap}
.controls{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px;align-items:center}
button{font:inherit;font-size:14px;min-height:40px;border:1px solid var(--hair);background:var(--card);color:var(--text);border-radius:10px;cursor:pointer;padding:8px 16px;transition:background-color .15s cubic-bezier(.22,1,.36,1),border-color .15s cubic-bezier(.22,1,.36,1)}
button:hover{background:var(--raised)}
button:active{transform:scale(.98)}
button:focus-visible,a:focus-visible{outline:2px solid var(--text);outline-offset:2px}
#voice{display:inline-flex;align-items:center;gap:8px;white-space:nowrap}
#voice.on{border-color:var(--accent);color:var(--accent)}
.controls a{color:var(--sub);font-size:14px;margin-left:8px}
#clock{margin-left:auto;font-family:'JetBrains Mono',monospace;font-size:13px;color:var(--mute);font-variant-numeric:tabular-nums}
#steps{flex:1 0 100%;display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:8px}
.step{text-align:left;position:relative;overflow:hidden;padding:8px 12px 12px;min-height:56px}
.step small{display:block;font-family:'JetBrains Mono',monospace;font-size:12px;color:var(--mute);margin-bottom:4px}
.step b{font-size:14px;font-weight:500}
.step i{position:absolute;height:2px;background:var(--accent);bottom:0;left:0}
.step[aria-current]{background:var(--raised);border-color:rgba(238,241,244,.22)}
.note{font-size:13px;color:var(--mute);line-height:1.7;margin:16px 0 0}
.note a{color:var(--sub)}
@media(max-width:560px){.wrap{padding:16px 12px 32px}#steps{grid-template-columns:repeat(2,minmax(0,1fr))}}
.embed header,.embed .note{display:none}.embed .wrap{padding:0;max-width:none}.embed body{background:transparent;overflow:hidden}
</style><script>if(/[?&]embed=1/.test(location.search)){document.documentElement.classList.add("embed");addEventListener("load",()=>{const f=()=>parent.postMessage({pmMotionH:document.body.scrollHeight},"*");new ResizeObserver(f).observe(document.body);f()})}</script></head><body><main class="wrap">
<header><p>{{ORG}} · {{DEPT}}</p><h1>{{TITLE_PLAIN}}</h1></header>
<figure class="stage"><canvas id="cv" role="img" aria-label="{{TITLE_PLAIN}}을 설명하는 모션그래픽. 화면 아래 자막으로 내용을 확인할 수 있습니다"></canvas><figcaption class="sr"><b id="capStep"></b><p id="capText" aria-live="polite"></p></figcaption></figure>
<div class="controls"><button id="play" type="button">일시정지</button><button id="replay" type="button">처음부터</button><button id="voice" type="button" aria-pressed="false">소리 켜기</button>{{MOBILE_LINK}}<span id="clock"></span><div id="steps" aria-label="장면 선택"></div></div>
<p class="note">{{BASIS}} · 그림은 이해를 돕기 위한 개념도입니다 {{SOURCE}}</p>
</main>
<script>window.STORY={{STORY_JSON}};</script>
<script>{{CODE}}</script>
</body></html>
